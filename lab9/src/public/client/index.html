<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учёт заявок — ЛР9</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="container"><header><h1>Система учёта заявок пользователей</h1><p class="subtitle">Лабораторная работа №9. Интеграция компонентов</p></header>
<section id="login-panel" class="card"><h2>Вход в систему</h2><form id="login-form"><div class="form-group"><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="username" required></div><div class="form-group"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><p id="login-error" class="error-text" role="alert"></p><button class="btn btn-primary">Войти</button></form></section>
<section id="workspace" hidden><div class="card controls"><span id="identity"></span><button id="logout" class="btn btn-action">Выйти</button></div>
<section class="card"><h2 id="form-heading">Новая заявка</h2><form id="ticket-form" novalidate><div class="form-group"><label for="title">Тема</label><input id="title" type="text" maxlength="200"><span class="error-text" data-error="title"></span></div><div class="form-group"><label for="description">Описание</label><textarea id="description" rows="2"></textarea><span class="error-text" data-error="description"></span></div>
<div class="controls"><div class="control-group"><label for="category_id">Категория</label><select id="category_id"></select><span class="error-text" data-error="category_id"></span></div><div class="control-group"><label for="assignee_id">Исполнитель</label><select id="assignee_id"></select><span class="error-text" data-error="assignee_id"></span></div><div class="control-group"><label for="due_date">Срок</label><input id="due_date" type="date"><span class="error-text" data-error="due_date"></span></div></div>
<div class="controls"><div class="control-group"><label for="priority">Приоритет</label><select id="priority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option><option value="critical">Критический</option></select><span class="error-text" data-error="priority"></span></div><div class="control-group"><label for="status">Статус</label><select id="status"><option value="new">Новая</option><option value="in_progress">В работе</option><option value="done">Решена</option></select><span class="error-text" data-error="status"></span></div></div><p id="form-error" class="error-text" role="alert"></p><button class="btn btn-success" id="save">Создать</button><button type="button" id="cancel" class="btn btn-action" hidden>Отменить изменение</button></form></section>
<section class="card controls"><div class="control-group search-box"><label for="search">Поиск по теме</label><input id="search" type="text" placeholder="Например, компьютер"></div><div class="control-group"><label for="filter-status">Статус</label><select id="filter-status"><option value="">Все</option><option value="new">Новая</option><option value="in_progress">В работе</option><option value="done">Решена</option></select></div><div class="control-group"><label for="sort">Сортировка</label><select id="sort"><option value="id">По номеру</option><option value="title">По теме</option><option value="due_date">По сроку</option></select></div><button id="load-btn" class="btn btn-primary">Обновить</button><span class="stats">Всего: <span id="counter" class="badge">0</span></span></section><div id="message" class="message-box" role="status" hidden></div><section class="card table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Тема / категория</th><th>Приоритет</th><th>Статус</th><th>Срок / исполнитель</th><th>Действия</th></tr></thead><tbody id="ticket-tbody"></tbody></table></section></section></main><script type="module" src="js/app.js"></script></body></html>
