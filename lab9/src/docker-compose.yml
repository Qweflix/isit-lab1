services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportdb
      POSTGRES_USER: lab9
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab9 -d supportdb"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    image: lab9-web
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - .:/app:ro
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: supportdb
      DB_USER: lab9
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
