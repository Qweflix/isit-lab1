<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление задачами (ЛР 5)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Система управления задачами</h1>
      <p class="subtitle">Лабораторная работа №5: Реализация клиентской логики</p>
    </header>

    <!-- Форма добавления задачи -->
    <section class="card">
      <h2>Новая задача</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Название задачи:</label>
          <input type="text" id="task-title" placeholder="Введите название задачи...">
          <div id="form-error" class="error-text"></div>
        </div>
        <div class="form-group">
          <label for="task-priority">Приоритет:</label>
          <select id="task-priority">
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
        </div>
        <button type="submit" id="add-btn" class="btn btn-primary">Добавить в список</button>
      </form>
    </section>

    <!-- Панель управления и фильтрации -->
    <section class="card controls">
      <div class="control-group">
        <button id="load-btn" class="btn btn-success">Загрузить с сервера</button>
      </div>
      <div class="control-group">
        <label for="filter-status">Статус:</label>
        <select id="filter-status">
          <option value="">Все</option>
          <option value="done">Выполненные</option>
          <option value="in_progress">В работе</option>
          <option value="pending">Ожидают</option>
        </select>
      </div>
      <div class="control-group search-box">
        <label for="search-input">Поиск:</label>
        <input type="text" id="search-input" placeholder="Поиск по названию...">
      </div>
      <div class="stats">
        Всего задач: <span id="task-counter" class="badge">0</span>
      </div>
    </section>

    <!-- Область состояний: загрузка / ошибки -->
    <div id="message-box" class="message-box" hidden></div>

    <!-- Таблица данных -->
    <section class="card table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 60px;">ID</th>
            <th>Название задачи</th>
            <th style="width: 140px;">Приоритет</th>
            <th style="width: 140px;">Статус</th>
            <th style="width: 180px;">Действия</th>
          </tr>
        </thead>
        <tbody id="task-tbody">
          <!-- Заполняется динамически через JS -->
        </tbody>
      </table>
    </section>
  </div>

  <!-- Подключение скриптов в строгом порядке -->
  <script src="js/mock-data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
